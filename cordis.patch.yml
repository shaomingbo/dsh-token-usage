# DSH Accounts & Usage: unified provider-account capabilities and official
# allowance observations beside the existing profile-private usage ledger.
# Connection transport owns admission/authentication; secrets stay in owner-only stores or
# DSH credentials and never enter SQLite, RPC responses, logs, or exports.

# Cordis 4.0.3 resolves the connection.rpc getter's captured context through
# the Connection provider's shadow, not the consumer's inject map. Give that
# owner webServer too; preserve webRuntime and the host's untouched config.
- id: connection
  inject: [webRuntime, webServer]

- insert:
    - id: dsh-token-usage
      name: dsh-token-usage
